<div
  dir="rtl"
  class="relative min-h-screen overflow-hidden bg-slate-50 dark:bg-[#070B14] font-sans transition-colors duration-300 selection:bg-cyan-500 selection:text-white"
>
  <!-- Ambient Background Glows & Grid -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-[15%] -right-[10%] h-[460px] w-[460px] rounded-full bg-cyan-400/20 dark:bg-cyan-500/10 blur-[120px]"></div>
    <div class="absolute -bottom-[15%] -left-[10%] h-[520px] w-[520px] rounded-full bg-blue-600/20 dark:bg-blue-600/15 blur-[130px]"></div>
    <div
      class="absolute inset-0 opacity-[0.03] dark:opacity-[0.04]"
      style="background-image: linear-gradient(to right, #64748b 1px, transparent 1px), linear-gradient(to bottom, #64748b 1px, transparent 1px); background-size: 40px 40px;"
    ></div>
  </div>

  <!-- Main Container -->
  <div class="relative z-10 flex min-h-screen items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div class="w-full max-w-5xl">
      <!-- Header -->
      <div class="mb-12 text-center">
        <div
          class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 shadow-xl shadow-blue-600/25 ring-4 ring-white/80 dark:ring-slate-900"
        >
          <i class="fa-solid fa-hospital text-2xl text-white"></i>
        </div>

        <span
          class="inline-flex items-center gap-2 rounded-full border border-cyan-500/20 bg-cyan-500/10 px-3.5 py-1 text-xs font-bold text-cyan-700 dark:text-cyan-300 mb-3"
        >
          <span class="h-2 w-2 rounded-full bg-cyan-500"></span>
          منصة Tabeeb الطبية
        </span>

        <h1 class="text-3xl sm:text-4xl font-black tracking-tight text-slate-900 dark:text-white">
          اختر العيادة
        </h1>

        <p class="mx-auto mt-3 max-w-md text-sm sm:text-base text-slate-500 dark:text-slate-400">
          اختر العيادة التي تريد العمل عليها وإدارة مواعيدها وملفات مرضاك
        </p>
      </div>

      <!-- Clinics Grid -->
      @if (clinics.length > 0) {
        <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">
          @for (clinic of clinics; track clinic.id) {
            <button
              type="button"
              (click)="selectClinic(clinic.id)"
              class="group relative flex flex-col justify-between overflow-hidden rounded-3xl border border-slate-200/80 dark:border-slate-800 bg-white/90 dark:bg-slate-900/90 backdrop-blur-xl p-6 text-right shadow-[0_12px_35px_-15px_rgba(15,23,42,0.08)] dark:shadow-black/40 transition-all duration-300 hover:-translate-y-1.5 hover:border-cyan-500/60 dark:hover:border-cyan-400/50 hover:shadow-[0_24px_50px_-15px_rgba(6,182,212,0.22)] cursor-pointer"
            >
              <!-- Top Accent Bar on Hover -->
              <span
                class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 opacity-0 transition-opacity duration-300 group-hover:opacity-100"
              ></span>

              <!-- Clinic Info -->
              <div class="flex items-start gap-4">
                <div
                  class="flex h-14 w-14 shrink-0 items-center justify-center rounded-2xl bg-cyan-500/10 text-cyan-600 dark:text-cyan-400 transition-all duration-300 group-hover:bg-gradient-to-tr group-hover:from-cyan-500 group-hover:to-blue-600 group-hover:text-white group-hover:shadow-lg group-hover:shadow-cyan-500/25"
                >
                  <i class="fa-solid fa-hospital text-xl"></i>
                </div>

                <div class="min-w-0 flex-1">
                  <h2
                    class="truncate text-lg font-extrabold text-slate-900 dark:text-white transition-colors group-hover:text-cyan-600 dark:group-hover:text-cyan-400"
                  >
                    {{ clinic.arName }}
                  </h2>

                  <p class="mt-1 truncate text-xs sm:text-sm font-medium text-slate-400 dark:text-slate-500" dir="ltr">
                    {{ clinic.enName }}
                  </p>
                </div>
              </div>

              <!-- Footer Action -->
              <div class="mt-6 flex items-center justify-between border-t border-slate-100 dark:border-slate-800/90 pt-4">
                <span
                  class="text-xs sm:text-sm font-bold text-slate-600 dark:text-slate-300 transition-colors group-hover:text-cyan-600 dark:group-hover:text-cyan-400"
                >
                  دخول إلى العيادة
                </span>

                <span
                  class="flex h-8 w-8 items-center justify-center rounded-xl bg-slate-100 dark:bg-slate-800 text-slate-500 dark:text-slate-400 transition-all duration-300 group-hover:bg-cyan-500 group-hover:text-white group-hover:-translate-x-1"
                >
                  <i class="fa-solid fa-arrow-left text-xs"></i>
                </span>
              </div>
            </button>
          }
        </div>
      } @else {
        <!-- Empty State -->
        <div
          class="mx-auto max-w-md rounded-3xl border border-dashed border-slate-300 dark:border-slate-700 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl px-6 py-14 text-center shadow-sm"
        >
          <div
            class="mx-auto mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-slate-100 dark:bg-slate-800 text-slate-400 dark:text-slate-500"
          >
            <i class="fa-solid fa-hospital text-3xl"></i>
          </div>

          <h3 class="text-lg font-bold text-slate-800 dark:text-white">
            لا توجد عيادات متاحة حالياً
          </h3>

          <p class="mt-1.5 text-sm text-slate-500 dark:text-slate-400">
            لم يتم ربط حسابك بأي عيادة بعد. تواصل مع إدارة المنصة للمساعدة.
          </p>
        </div>
      }
    </div>
  </div>
</div>
