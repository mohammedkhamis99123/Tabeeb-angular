<div
  [attr.dir]="translate.currentLang === 'ae' ? 'rtl' : 'ltr'"
  class="relative min-h-screen overflow-hidden bg-slate-50 dark:bg-[#070B14] font-sans transition-colors duration-300 selection:bg-cyan-500 selection:text-white"
>
  <!-- Ambient Background Glows & Grid -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-[15%] -right-[10%] h-[460px] w-[460px] rounded-full bg-rose-500/15 dark:bg-rose-500/10 blur-[120px]"></div>
    <div class="absolute -bottom-[15%] -left-[10%] h-[520px] w-[520px] rounded-full bg-blue-600/20 dark:bg-blue-600/15 blur-[130px]"></div>
    <div
      class="absolute inset-0 opacity-[0.03] dark:opacity-[0.04]"
      style="background-image: linear-gradient(to right, #64748b 1px, transparent 1px), linear-gradient(to bottom, #64748b 1px, transparent 1px); background-size: 40px 40px;"
    ></div>
  </div>

  <!-- Main Container -->
  <div class="relative z-10 flex min-h-screen items-center justify-center px-4 py-12 sm:px-6 lg:px-8">
    <div
      class="w-full max-w-2xl rounded-[2rem] border border-white/70 dark:border-slate-800/80 bg-white/90 dark:bg-slate-900/90 backdrop-blur-2xl p-8 sm:p-12 text-center shadow-[0_32px_80px_-20px_rgba(15,23,42,0.16)] dark:shadow-[0_32px_80px_-20px_rgba(0,0,0,0.75)]"
    >
      <!-- Top Badge & Code -->
      <div class="mx-auto mb-6 inline-flex items-center gap-2 rounded-full border border-rose-500/20 bg-rose-500/10 px-4 py-1.5 text-xs font-bold text-rose-600 dark:text-rose-400">
        <span class="h-2 w-2 rounded-full bg-rose-500"></span>
        <span>Error 403 • صلاحية غير متاحة</span>
      </div>

      <!-- Shield / Lock Icon -->
      <div
        class="mx-auto mb-6 flex h-20 w-20 items-center justify-center rounded-3xl bg-gradient-to-tr from-rose-500/15 via-amber-500/10 to-cyan-500/15 border border-rose-500/20 text-rose-600 dark:text-rose-400 shadow-lg"
      >
        <i class="fa-solid fa-shield-halved text-3xl"></i>
      </div>

      <!-- Title & Description -->
      <h1 class="text-2xl sm:text-4xl font-black tracking-tight text-slate-900 dark:text-white">
        غير مصرح لك بالوصول إلى هذه الصفحة
      </h1>

      <p class="mx-auto mt-3.5 max-w-lg text-sm sm:text-base leading-relaxed text-slate-500 dark:text-slate-400">
        عذراً، لا يمتلك حسابك الصلاحيات الكافية لعرض هذا القسم أو تنفيذ هذا الإجراء داخل منصة
        <span class="font-bold text-slate-700 dark:text-slate-200">Tabeeb</span>.
      </p>

      <!-- Info Hint Box -->
      <div
        class="mx-auto mt-6 max-w-md rounded-2xl border border-slate-200/80 dark:border-slate-800 bg-slate-50/90 dark:bg-slate-800/50 px-4 py-3 text-xs text-slate-600 dark:text-slate-300 flex items-center justify-center gap-2.5"
      >
        <i class="fa-solid fa-circle-info text-cyan-500 text-sm shrink-0"></i>
        <span>إذا كنت تعتقد أن هذا خطأ، تواصل مع مدير النظام أو غيّر العيادة الحالية.</span>
      </div>

      <!-- Action Buttons -->
      <div class="mt-8 flex flex-col sm:flex-row items-center justify-center gap-3.5">
        <a
          routerLink="/"
          class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-2xl bg-gradient-to-r from-cyan-500 via-blue-600 to-indigo-600 hover:from-cyan-600 hover:via-blue-700 hover:to-indigo-700 px-6 py-3.5 text-sm font-bold text-white shadow-xl shadow-blue-600/25 transition-all duration-300 hover:-translate-y-0.5"
        >
          <i class="fa-solid fa-house text-xs"></i>
          <span>العودة إلى الرئيسية</span>
        </a>

        <button
          type="button"
          (click)="goBack()"
          class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-2xl border border-slate-200 dark:border-slate-700 bg-white dark:bg-slate-800 hover:bg-slate-100 dark:hover:bg-slate-700/80 px-6 py-3.5 text-sm font-bold text-slate-700 dark:text-slate-200 transition-all cursor-pointer"
        >
          <i class="fa-solid fa-arrow-right text-xs ltr:rotate-180"></i>
          <span>الرجوع للخلف</span>
        </button>
      </div>

      <!-- Footer Brand -->
      <div class="mt-9 pt-5 border-t border-slate-100 dark:border-slate-800/80 flex items-center justify-between text-xs text-slate-400 dark:text-slate-500">
        <span class="font-bold text-slate-600 dark:text-slate-300">Tabeeb Medical Platform</span>
        <span>&copy; 2026</span>
      </div>
    </div>
  </div>
</div>
