<div
    class="relative min-h-screen overflow-hidden bg-slate-50"
    dir="rtl"
>
    <div
        class="relative z-10 flex min-h-screen items-center justify-center px-4 py-10"
    >
        <div class="w-full max-w-5xl">

            <!-- Header -->
            <div class="mb-10 text-center">

                <div
                    class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl bg-primary shadow-lg shadow-primary/20"
                >
                    <i class="fa-solid fa-hospital text-2xl text-white"></i>
                </div>

                <h1 class="text-3xl font-bold text-slate-900">
                    اختر العيادة
                </h1>

                <p class="mt-3 text-slate-500">
                    اختر العيادة التي تريد العمل عليها
                </p>

            </div>


            <!-- Clinics -->
            <div class="grid grid-cols-1 gap-5 sm:grid-cols-2 lg:grid-cols-3">

                @for (clinic of clinics; track clinic.id) {

                    <button
                        type="button"
                        (click)="selectClinic(clinic.id)"
                        class="group relative rounded-2xl border border-slate-200 bg-white p-6 text-right shadow-sm transition-all duration-300 hover:-translate-y-1 hover:border-primary hover:shadow-xl"
                    >

                        <!-- Icon -->
                        <div class="flex items-center gap-4">

                            <div
                                class="flex h-14 w-14 shrink-0 items-center justify-center rounded-xl bg-primary/10 text-primary transition-all duration-300 group-hover:bg-primary group-hover:text-white"
                            >
                                <i class="fa-solid fa-hospital text-xl"></i>
                            </div>

                            <!-- Name -->
                            <div class="min-w-0">

                                <h2
                                    class="text-lg font-bold text-slate-800 transition-colors group-hover:text-primary"
                                >
                                    {{ clinic.arName }}
                                </h2>

                                <p
                                    class="mt-1 text-sm text-slate-400"
                                >
                                    {{ clinic.enName }}
                                </p>

                            </div>

                        </div>


                        <!-- Arrow -->
                        <div
                            class="mt-6 flex items-center justify-between border-t border-slate-100 pt-4"
                        >

                            <span
                                class="text-sm font-medium text-slate-500 group-hover:text-primary"
                            >
                                اختيار العيادة
                            </span>

                            <i
                                class="fa-solid fa-arrow-left text-sm text-slate-400 transition-transform duration-300 group-hover:-translate-x-1 group-hover:text-primary"
                            ></i>

                        </div>

                    </button>

                }

            </div>


            <!-- Empty -->
            @if (clinics.length === 0) {

                <div class="py-16 text-center">

                    <i
                        class="fa-solid fa-hospital mb-4 text-4xl text-slate-300"
                    ></i>

                    <p class="text-slate-500">
                        لا توجد عيادات متاحة
                    </p>

                </div>

            }

        </div>
    </div>
</div>
